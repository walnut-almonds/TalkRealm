version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: talkrealm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: talkrealm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: talkrealm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - talkrealm-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U talkrealm -d talkrealm" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: talkrealm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - talkrealm-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: talkrealm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_SERVER_URL: ${MINIO_PUBLIC_ENDPOINT} # e.g. https://media.qrumi.org
    volumes:
      - minio_data:/data
    networks:
      - talkrealm-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    container_name: talkrealm-livekit
    restart: unless-stopped
    command: '--bind 0.0.0.0 --keys "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"'
    expose:
      - "7880"
    ports:
      - "7881:7881"
      - "50100-50200:50100-50200/udp"
    networks:
      - talkrealm-network
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:7880" ]
      interval: 15s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/walnut-almonds/talkrealm:latest
    container_name: talkrealm-app
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - /opt/talkrealm/config.yaml:/talk-realm/config.yaml:ro
    networks:
      - talkrealm-network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: talkrealm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/talkrealm/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/certs/qrumi.org.pem:/etc/ssl/certs/qrumi.org.pem:ro
      - /etc/ssl/private/qrumi.org.key:/etc/ssl/private/qrumi.org.key:ro
    networks:
      - talkrealm-network
    depends_on:
      - app
      - livekit

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  talkrealm-network:
    driver: bridge
