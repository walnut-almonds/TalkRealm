definitions:
  handler.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handler.JoinByInviteRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  handler.PositionRequest:
    properties:
      position:
        minimum: 0
        type: integer
    required:
    - position
    type: object
  handler.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handler.SuccessResponse:
    properties:
      message:
        type: string
    type: object
  handler.UpdateMemberRoleRequest:
    properties:
      role:
        enum:
        - admin
        - moderator
        - member
        type: string
    required:
    - role
    type: object
  handler.ackChannelReq:
    properties:
      last_message_id:
        type: integer
    required:
    - last_message_id
    type: object
  handler.createCrosswordReq:
    properties:
      count:
        description: 答案數（少3/中6/多9）；0 = 預設
        type: integer
      locale:
        type: string
      tier:
        type: integer
    required:
    - tier
    type: object
  handler.createFeedPostBody:
    properties:
      content:
        type: string
      file_ids:
        items:
          type: integer
        type: array
    type: object
  handler.createLevelReq:
    properties:
      count:
        description: 答案數（少3/中6/多9）；0 = 該模式預設
        type: integer
      locale:
        description: 前端 i18n locale；空值 fallback en
        type: string
      mode:
        type: string
      tier:
        type: integer
    required:
    - mode
    - tier
    type: object
  handler.feedContentBody:
    properties:
      content:
        type: string
    required:
    - content
    type: object
  handler.learnSlotReq:
    properties:
      slot:
        type: integer
    type: object
  handler.srsAnswerReq:
    properties:
      guess:
        type: string
      index:
        type: integer
    type: object
  handler.startCampaignReq:
    properties:
      locale:
        type: string
    type: object
  handler.startSRSReq:
    properties:
      count:
        type: integer
      locale:
        type: string
    type: object
  model.Channel:
    properties:
      created_at:
        type: string
      guild_id:
        description: nil for DM channels
        type: integer
      id:
        type: integer
      name:
        description: empty for DM channels
        type: string
      participants:
        items:
          $ref: '#/definitions/model.ChannelParticipant'
        type: array
      position:
        type: integer
      topic:
        type: string
      type:
        description: text, voice, dm
        type: string
      updated_at:
        type: string
    type: object
  model.ChannelParticipant:
    properties:
      channel_id:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      user:
        $ref: '#/definitions/model.User'
      user_id:
        type: integer
    type: object
  model.FeedComment:
    properties:
      author:
        $ref: '#/definitions/model.User'
      author_id:
        type: integer
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      is_edited:
        type: boolean
      post_id:
        type: integer
      updated_at:
        type: string
    type: object
  model.FeedPostAttachment:
    properties:
      created_at:
        type: string
      file:
        $ref: '#/definitions/model.File'
      file_id:
        type: integer
      id:
        type: integer
      post_id:
        type: integer
    type: object
  model.File:
    properties:
      content_type:
        type: string
      created_at:
        type: string
      expires_at:
        description: nil = 永久
        type: string
      filename:
        description: 原始檔名
        type: string
      id:
        type: integer
      last_accessed_at:
        description: LRU 依據
        type: string
      size:
        description: bytes
        type: integer
      status:
        description: pending, active, deleted
        type: string
      storage_key:
        description: Minio object key
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  model.Guild:
    properties:
      created_at:
        type: string
      description:
        type: string
      icon:
        type: string
      id:
        type: integer
      name:
        type: string
      owner:
        $ref: '#/definitions/model.User'
      owner_id:
        type: integer
      updated_at:
        type: string
    type: object
  model.GuildInvite:
    properties:
      code:
        type: string
      created_at:
        type: string
      creator:
        $ref: '#/definitions/model.User'
      creator_id:
        type: integer
      expires_at:
        description: nil = no expiry
        type: string
      guild:
        $ref: '#/definitions/model.Guild'
      guild_id:
        type: integer
      id:
        type: integer
      max_uses:
        description: 0 = unlimited
        type: integer
      updated_at:
        type: string
      uses:
        type: integer
    type: object
  model.GuildMember:
    properties:
      created_at:
        type: string
      guild_id:
        type: integer
      id:
        type: integer
      joined_at:
        type: string
      nickname:
        type: string
      role:
        description: owner, admin, member
        type: string
      updated_at:
        type: string
      user:
        $ref: '#/definitions/model.User'
      user_id:
        type: integer
    type: object
  model.Message:
    properties:
      attachments:
        description: 附件
        items:
          $ref: '#/definitions/model.MessageAttachment'
        type: array
      channel_id:
        type: integer
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      is_edited:
        description: 是否被編輯過
        type: boolean
      nonce:
        description: client 產生的冪等 key（可選）
        type: string
      parent_id:
        description: nil = 貼文/一般訊息；有值 = 留言，指向貼文
        type: integer
      type:
        description: text, image, file
        type: string
      updated_at:
        type: string
      user:
        $ref: '#/definitions/model.User'
      user_id:
        type: integer
    type: object
  model.MessageAttachment:
    properties:
      created_at:
        type: string
      file:
        $ref: '#/definitions/model.File'
      file_id:
        type: integer
      id:
        type: integer
      message_id:
        type: integer
    type: object
  model.MessageTranslation:
    properties:
      content_en:
        type: string
      content_ja:
        type: string
      content_zh:
        type: string
      content_zh_tw:
        description: 繁體中文
        type: string
      message_id:
        type: integer
      original_lang:
        description: zh, zh-tw, ja, en
        type: string
      translated_at:
        type: string
      translation_status:
        description: pending, completed, failed
        type: string
    type: object
  model.User:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      nickname:
        type: string
      preferred_lang:
        description: zh, zh-tw, ja, en (translation target)
        type: string
      status:
        description: online, idle, dnd, invisible (also accepts offline, busy, away)
        type: string
      ui_locale:
        description: zh, zh-tw, ja, en (UI locale, empty = not set)
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  service.CampaignLevelView:
    properties:
      done:
        type: boolean
      level_no:
        type: integer
      score:
        type: integer
    type: object
  service.CampaignOverviewView:
    properties:
      furthest:
        description: 已通關的最大關卡編號；0 = 尚未通關任何關
        type: integer
      levels:
        items:
          $ref: '#/definitions/service.CampaignLevelView'
        type: array
      total:
        type: integer
    type: object
  service.ChannelUnreadCount:
    properties:
      channel_id:
        type: integer
      guild_id:
        type: integer
      mention_count:
        type: integer
      unread_count:
        type: integer
    type: object
  service.CommentListResponse:
    properties:
      comments:
        items:
          $ref: '#/definitions/service.FeedCommentResponse'
        type: array
      has_more:
        type: boolean
    type: object
  service.CreateChannelRequest:
    properties:
      guild_id:
        type: integer
      name:
        maxLength: 100
        minLength: 1
        type: string
      position:
        type: integer
      topic:
        maxLength: 1024
        type: string
      type:
        enum:
        - text
        - voice
        - feed
        type: string
    required:
    - name
    - type
    type: object
  service.CreateGuildRequest:
    properties:
      description:
        maxLength: 500
        type: string
      icon:
        maxLength: 256
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - name
    type: object
  service.CreateInviteRequest:
    properties:
      expires_in:
        description: 秒數，0 = 永不過期
        type: integer
      max_uses:
        description: 0 = unlimited
        type: integer
    type: object
  service.CreateMessageRequest:
    properties:
      channel_id:
        type: integer
      content:
        type: string
      file_ids:
        description: 附加的已確認檔案 ID（可選）
        items:
          type: integer
        type: array
      nonce:
        description: client 產生的冪等 key（可選，建議 UUID v4）
        type: string
      parent_id:
        description: 有值 = 留言，指向貼文（單層）
        type: integer
      type:
        description: 'text, image, file (預設: text)'
        type: string
    type: object
  service.CrosswordSlot:
    properties:
      col:
        type: integer
      definition:
        type: string
      dir:
        description: 空字串 = bonus 字，此時 row/col 無意義
        type: string
      length:
        type: integer
      masked:
        type: string
      row:
        type: integer
      solved:
        type: boolean
      word:
        type: string
    type: object
  service.CrosswordView:
    properties:
      campaign:
        description: '>0 = 固定關卡編號'
        type: integer
      cols:
        type: integer
      letters:
        type: string
      level_id:
        type: string
      rows:
        type: integer
      tier:
        type: integer
      words:
        items:
          $ref: '#/definitions/service.CrosswordSlot'
        type: array
    type: object
  service.DailyView:
    properties:
      date:
        type: string
      level:
        allOf:
        - $ref: '#/definitions/service.LevelView'
        description: 未 played 時
      played:
        type: boolean
      score:
        description: played 時
        type: integer
    type: object
  service.FeedCommentResponse:
    properties:
      author:
        $ref: '#/definitions/model.User'
      author_id:
        type: integer
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      is_edited:
        type: boolean
      like_count:
        type: integer
      liked_by_me:
        type: boolean
      post_id:
        type: integer
      updated_at:
        type: string
    type: object
  service.FeedPostResponse:
    properties:
      attachments:
        items:
          $ref: '#/definitions/model.FeedPostAttachment'
        type: array
      author:
        $ref: '#/definitions/model.User'
      author_id:
        type: integer
      comment_count:
        type: integer
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      is_edited:
        type: boolean
      like_count:
        type: integer
      liked_by_me:
        type: boolean
      updated_at:
        type: string
    type: object
  service.FollowListResponse:
    properties:
      count:
        type: integer
      users:
        items:
          $ref: '#/definitions/model.User'
        type: array
    type: object
  service.GameStatus:
    properties:
      has_guessed:
        type: boolean
      hidden_lang:
        type: string
      is_correct:
        type: boolean
      similarity_score:
        type: number
    type: object
  service.GuessOutcome:
    properties:
      completed:
        type: boolean
      correct:
        type: boolean
      definition:
        type: string
      phonetic:
        type: string
      slot:
        type: integer
      total_xp:
        type: integer
      word:
        type: string
      xp_awarded:
        type: integer
    type: object
  service.GuessRequest:
    properties:
      guess_content:
        type: string
      hidden_lang:
        description: zh, zh-tw, ja, en
        type: string
    required:
    - guess_content
    - hidden_lang
    type: object
  service.GuessResult:
    properties:
      correct_content:
        description: 回傳正確答案（猜中或用戶已猜過）
        type: string
      is_correct:
        type: boolean
      similarity_score:
        type: number
    type: object
  service.HintOutcome:
    properties:
      definition:
        type: string
      masked:
        type: string
      slot:
        type: integer
      tier:
        type: integer
    type: object
  service.LeaderboardEntry:
    properties:
      avatar:
        type: string
      level:
        description: 關卡榜：已通關的最遠關卡
        type: integer
      rank:
        type: integer
      score:
        type: integer
      user_id:
        type: integer
      username:
        type: string
    type: object
  service.LeaderboardView:
    properties:
      date:
        type: string
      me:
        allOf:
        - $ref: '#/definitions/service.LeaderboardEntry'
        description: 未上榜（未完成/未得分）時 nil
      top:
        items:
          $ref: '#/definitions/service.LeaderboardEntry'
        type: array
      week:
        type: string
    type: object
  service.LearnGuessRequest:
    properties:
      slot:
        type: integer
      word:
        type: string
    required:
    - word
    type: object
  service.LearnStatsView:
    properties:
      recent_words:
        items:
          $ref: '#/definitions/service.RecentWordView'
        type: array
      streak:
        type: integer
      words_learned:
        type: integer
      xp:
        type: integer
    type: object
  service.LevelView:
    properties:
      letters:
        type: string
      level_id:
        type: string
      mode:
        type: string
      slots:
        items:
          $ref: '#/definitions/service.SlotView'
        type: array
      tier:
        type: integer
    type: object
  service.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  service.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        description: 秒數
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
      user:
        $ref: '#/definitions/model.User'
    type: object
  service.MessageListResponse:
    properties:
      has_more:
        type: boolean
      messages:
        items:
          $ref: '#/definitions/model.Message'
        type: array
    type: object
  service.PermalinkChannel:
    properties:
      guild_id:
        type: integer
      id:
        type: integer
      name:
        type: string
      type:
        type: string
    type: object
  service.PermalinkMessage:
    properties:
      author:
        $ref: '#/definitions/model.User'
      content:
        type: string
      id:
        type: integer
    type: object
  service.PermalinkResponse:
    properties:
      channel:
        $ref: '#/definitions/service.PermalinkChannel'
      message:
        $ref: '#/definitions/service.PermalinkMessage'
    type: object
  service.PostListResponse:
    properties:
      has_more:
        type: boolean
      posts:
        items:
          $ref: '#/definitions/service.PostResponse'
        type: array
    type: object
  service.PostResponse:
    properties:
      attachments:
        description: 附件
        items:
          $ref: '#/definitions/model.MessageAttachment'
        type: array
      channel_id:
        type: integer
      comment_count:
        type: integer
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      is_edited:
        description: 是否被編輯過
        type: boolean
      like_count:
        type: integer
      liked_by_me:
        type: boolean
      nonce:
        description: client 產生的冪等 key（可選）
        type: string
      parent_id:
        description: nil = 貼文/一般訊息；有值 = 留言，指向貼文
        type: integer
      type:
        description: text, image, file
        type: string
      updated_at:
        type: string
      user:
        $ref: '#/definitions/model.User'
      user_id:
        type: integer
    type: object
  service.PresignUploadRequest:
    properties:
      content_type:
        type: string
      filename:
        type: string
      size:
        type: integer
    required:
    - content_type
    - filename
    - size
    type: object
  service.PresignUploadResponse:
    properties:
      expires_in:
        description: 秒
        type: integer
      file_id:
        type: integer
      storage_key:
        type: string
      upload_url:
        type: string
    type: object
  service.PublicUser:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      id:
        type: integer
      nickname:
        type: string
      status:
        type: string
      username:
        type: string
    type: object
  service.RecentWordView:
    properties:
      correct:
        type: boolean
      definition:
        type: string
      word:
        type: string
    type: object
  service.RegisterRequest:
    properties:
      email:
        type: string
      nickname:
        maxLength: 64
        type: string
      password:
        maxLength: 128
        minLength: 6
        type: string
      username:
        maxLength: 32
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  service.SRSAnswerOutcome:
    properties:
      answer:
        type: string
      completed:
        type: boolean
      correct:
        type: boolean
      next_stage:
        type: integer
      phonetic:
        type: string
      total_xp:
        type: integer
      trans:
        type: string
      xp_awarded:
        type: integer
    type: object
  service.SRSCardView:
    properties:
      index:
        type: integer
      is_new:
        type: boolean
      length:
        description: 答案長度（輸入框寬度提示）
        type: integer
      text_en:
        description: 含 "{{}}"，前端渲染成輸入框
        type: string
      trans:
        type: string
    type: object
  service.SRSOverviewView:
    properties:
      due_count:
        type: integer
      new_available:
        type: integer
    type: object
  service.SRSSessionView:
    properties:
      cards:
        items:
          $ref: '#/definitions/service.SRSCardView'
        type: array
      new_count:
        type: integer
      session_id:
        type: string
      total:
        type: integer
    type: object
  service.SlotView:
    properties:
      definition:
        type: string
      length:
        type: integer
      masked:
        type: string
      solved:
        type: boolean
      word:
        type: string
    type: object
  service.TimelineResponse:
    properties:
      has_more:
        type: boolean
      posts:
        items:
          $ref: '#/definitions/service.FeedPostResponse'
        type: array
    type: object
  service.UpdateChannelRequest:
    properties:
      name:
        maxLength: 100
        minLength: 1
        type: string
      position:
        type: integer
      topic:
        maxLength: 1024
        type: string
      type:
        enum:
        - text
        - voice
        - feed
        type: string
    type: object
  service.UpdateGuildRequest:
    properties:
      description:
        maxLength: 500
        type: string
      icon:
        maxLength: 256
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
    type: object
  service.UpdateMessageRequest:
    properties:
      content:
        type: string
    required:
    - content
    type: object
  service.UpdateUserRequest:
    properties:
      avatar:
        maxLength: 256
        type: string
      nickname:
        maxLength: 64
        type: string
      preferred_lang:
        enum:
        - zh
        - zh-tw
        - ja
        - en
        type: string
      status:
        enum:
        - offline
        - busy
        - away
        - online
        - idle
        - dnd
        - invisible
        type: string
      ui_locale:
        enum:
        - zh
        - zh-tw
        - ja
        - en
        type: string
    type: object
  service.WallCommentListResponse:
    properties:
      comments:
        items:
          $ref: '#/definitions/service.WallCommentResponse'
        type: array
      has_more:
        type: boolean
    type: object
  service.WallCommentResponse:
    properties:
      attachments:
        description: 附件
        items:
          $ref: '#/definitions/model.MessageAttachment'
        type: array
      channel_id:
        type: integer
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      is_edited:
        description: 是否被編輯過
        type: boolean
      like_count:
        type: integer
      liked_by_me:
        type: boolean
      nonce:
        description: client 產生的冪等 key（可選）
        type: string
      parent_id:
        description: nil = 貼文/一般訊息；有值 = 留言，指向貼文
        type: integer
      type:
        description: text, image, file
        type: string
      updated_at:
        type: string
      user:
        $ref: '#/definitions/model.User'
      user_id:
        type: integer
    type: object
  voice.RoomTokenResponse:
    properties:
      identity:
        type: string
      room_name:
        type: string
      token:
        type: string
      url:
        type: string
    type: object
info:
  contact:
    email: support@talkrealm.example.com
    name: API Support
    url: http://www.talkrealm.example.com/support
  description: TalkRealm 是一個即時通訊平台，提供文字和語音聊天功能。
  termsOfService: http://talkrealm.example.com/terms/
  title: TalkRealm API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登入資訊
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.LoginResponse'
      summary: 使用者登入
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: 註冊資訊
