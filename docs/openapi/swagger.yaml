definitions:
  handler.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  handler.JoinByInviteRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  handler.PositionRequest:
    properties:
      position:
        minimum: 0
        type: integer
    required:
    - position
    type: object
  handler.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  handler.SuccessResponse:
    properties:
      message:
        type: string
    type: object
  handler.UpdateMemberRoleRequest:
    properties:
      role:
        enum:
        - admin
        - moderator
        - member
        type: string
    required:
    - role
    type: object
  model.Channel:
    properties:
      created_at:
        type: string
      guild_id:
        description: nil for DM channels
        type: integer
      id:
        type: integer
      name:
        description: empty for DM channels
        type: string
      participants:
        items:
          $ref: '#/definitions/model.ChannelParticipant'
        type: array
      position:
        type: integer
      topic:
        type: string
      type:
        description: text, voice, dm
        type: string
      updated_at:
        type: string
    type: object
  model.ChannelParticipant:
    properties:
      channel_id:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      user:
        $ref: '#/definitions/model.User'
      user_id:
        type: integer
    type: object
  model.File:
    properties:
      content_type:
        type: string
      created_at:
        type: string
      expires_at:
        description: nil = 永久
        type: string
      filename:
        description: 原始檔名
        type: string
      id:
        type: integer
      last_accessed_at:
        description: LRU 依據
        type: string
      size:
        description: bytes
        type: integer
      status:
        description: pending, active, deleted
        type: string
      storage_key:
        description: Minio object key
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  model.Guild:
    properties:
      created_at:
        type: string
      description:
        type: string
      icon:
        type: string
      id:
        type: integer
      name:
        type: string
      owner:
        $ref: '#/definitions/model.User'
      owner_id:
        type: integer
      updated_at:
        type: string
    type: object
  model.GuildInvite:
    properties:
      code:
        type: string
      created_at:
        type: string
      creator:
        $ref: '#/definitions/model.User'
      creator_id:
        type: integer
      expires_at:
        description: nil = no expiry
        type: string
      guild:
        $ref: '#/definitions/model.Guild'
      guild_id:
        type: integer
      id:
        type: integer
      max_uses:
        description: 0 = unlimited
        type: integer
      updated_at:
        type: string
      uses:
        type: integer
    type: object
  model.GuildMember:
    properties:
      created_at:
        type: string
      guild_id:
        type: integer
      id:
        type: integer
      joined_at:
        type: string
      nickname:
        type: string
      role:
        description: owner, admin, member
        type: string
      updated_at:
        type: string
      user:
        $ref: '#/definitions/model.User'
      user_id:
        type: integer
    type: object
  model.Message:
    properties:
      attachments:
        description: 附件
        items:
          $ref: '#/definitions/model.MessageAttachment'
        type: array
      channel_id:
        type: integer
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      is_edited:
        description: 是否被編輯過
        type: boolean
      nonce:
        description: client 產生的冪等 key（可選）
        type: string
      type:
        description: text, image, file
        type: string
      updated_at:
        type: string
      user:
        $ref: '#/definitions/model.User'
      user_id:
        type: integer
    type: object
  model.MessageAttachment:
    properties:
      created_at:
        type: string
      file:
        $ref: '#/definitions/model.File'
      file_id:
        type: integer
      id:
        type: integer
      message_id:
        type: integer
    type: object
  model.MessageTranslation:
    properties:
      content_en:
        type: string
      content_ja:
        type: string
      content_zh:
        type: string
      content_zh_tw:
        description: 繁體中文
        type: string
      message_id:
        type: integer
      original_lang:
        description: zh, zh-tw, ja, en
        type: string
      translated_at:
        type: string
      translation_status:
        description: pending, completed, failed
        type: string
    type: object
  model.User:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      nickname:
        type: string
      preferred_lang:
        description: zh, ja, en
        type: string
      status:
        description: online, offline, busy, away
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  service.CreateChannelRequest:
    properties:
      guild_id:
        type: integer
      name:
        maxLength: 100
        minLength: 1
        type: string
      position:
        type: integer
      topic:
        maxLength: 1024
        type: string
      type:
        enum:
        - text
        - voice
        type: string
    required:
    - name
    - type
    type: object
  service.CreateGuildRequest:
    properties:
      description:
        maxLength: 500
        type: string
      icon:
        maxLength: 256
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - name
    type: object
  service.CreateInviteRequest:
    properties:
      expires_in:
        description: 秒數，0 = 永不過期
        type: integer
      max_uses:
        description: 0 = unlimited
        type: integer
    type: object
  service.CreateMessageRequest:
    properties:
      channel_id:
        type: integer
      content:
        type: string
      file_ids:
        description: 附加的已確認檔案 ID（可選）
        items:
          type: integer
        type: array
      nonce:
        description: client 產生的冪等 key（可選，建議 UUID v4）
        type: string
      type:
        description: 'text, image, file (預設: text)'
        type: string
    type: object
  service.GameStatus:
    properties:
      has_guessed:
        type: boolean
      hidden_lang:
        type: string
      is_correct:
        type: boolean
      similarity_score:
        type: number
    type: object
  service.GuessRequest:
    properties:
      guess_content:
        type: string
      hidden_lang:
        description: zh, zh-tw, ja, en
        type: string
    required:
    - guess_content
    - hidden_lang
    type: object
  service.GuessResult:
    properties:
      correct_content:
        description: 回傳正確答案（猜中或用戶已猜過）
        type: string
      is_correct:
        type: boolean
      similarity_score:
        type: number
    type: object
  service.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  service.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        description: 秒數
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
      user:
        $ref: '#/definitions/model.User'
    type: object
  service.MessageListResponse:
    properties:
      has_more:
        type: boolean
      messages:
        items:
          $ref: '#/definitions/model.Message'
        type: array
    type: object
  service.PresignUploadRequest:
    properties:
      content_type:
        type: string
      filename:
        type: string
      size:
        type: integer
    required:
    - content_type
    - filename
    - size
    type: object
  service.PresignUploadResponse:
    properties:
      expires_in:
        description: 秒
        type: integer
      file_id:
        type: integer
      storage_key:
        type: string
      upload_url:
        type: string
    type: object
  service.PublicUser:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      id:
        type: integer
      nickname:
        type: string
      status:
        type: string
      username:
        type: string
    type: object
  service.RegisterRequest:
    properties:
      email:
        type: string
      nickname:
        maxLength: 64
        type: string
      password:
        maxLength: 128
        minLength: 6
        type: string
      username:
        maxLength: 32
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  service.UpdateChannelRequest:
    properties:
      name:
        maxLength: 100
        minLength: 1
        type: string
      position:
        type: integer
      topic:
        maxLength: 1024
        type: string
      type:
        enum:
        - text
        - voice
        type: string
    type: object
  service.UpdateGuildRequest:
    properties:
      description:
        maxLength: 500
        type: string
      icon:
        maxLength: 256
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
    type: object
  service.UpdateMessageRequest:
    properties:
      content:
        type: string
    required:
    - content
    type: object
  service.UpdateUserRequest:
    properties:
      avatar:
        maxLength: 256
        type: string
      nickname:
        maxLength: 64
        type: string
      preferred_lang:
        enum:
        - zh
        - zh-tw
        - ja
        - en
        type: string
      status:
        enum:
        - offline
        - busy
        - away
        type: string
    type: object
  voice.RoomTokenResponse:
    properties:
      identity:
        type: string
      room_name:
        type: string
      token:
        type: string
      url:
        type: string
    type: object
info:
  contact:
    email: support@talkrealm.example.com
    name: API Support
    url: http://www.talkrealm.example.com/support
  description: TalkRealm 是一個即時通訊平台，提供文字和語音聊天功能。
  termsOfService: http://talkrealm.example.com/terms/
  title: TalkRealm API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登入資訊
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.LoginResponse'
      summary: 使用者登入
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: 註冊資訊
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.User'
      summary: 使用者註冊
      tags:
      - auth
  /api/users/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.User'
      security:
      - BearerAuth: []
      summary: 取得當前使用者資訊
      tags:
      - users
    patch:
      consumes:
      - application/json
      parameters:
      - description: 更新資訊
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.User'
      security:
      - BearerAuth: []
      summary: 更新當前使用者資訊
      tags:
      - users
  /api/v1/auth/google:
    get:
      responses:
        "302":
          description: Found
      summary: Google OAuth 登入
      tags:
      - auth
  /api/v1/auth/google/callback:
    get:
      responses:
        "302":
          description: Found
      summary: Google OAuth Callback
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 登出
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.LoginResponse'
      summary: 換發 access token
      tags:
      - auth
  /api/v1/channels/{id}:
    delete:
      consumes:
      - application/json
      description: 刪除頻道（僅擁有者或管理員）
      parameters:
      - description: 頻道 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 刪除頻道
      tags:
      - Channel
    get:
      consumes:
      - application/json
      description: 取得指定頻道的詳細資訊
      parameters:
      - description: 頻道 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Channel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 取得頻道詳情
      tags:
      - Channel
    put:
      consumes:
      - application/json
      description: 更新頻道資訊（僅擁有者或管理員）
      parameters:
      - description: 頻道 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新頻道請求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.UpdateChannelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Channel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 更新頻道
      tags:
      - Channel
  /api/v1/channels/{id}/messages:
    get:
      description: 列出指定頻道的訊息（cursor-based 分頁）
      parameters:
      - description: 頻道 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 訊息 ID，取得此 ID 之前的訊息
        in: query
        name: before
        type: integer
      - default: 50
        description: 每次取得數量 (1-100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.MessageListResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 列出頻道訊息
      tags:
      - messages
    post:
      consumes:
      - application/json
      description: 在指定頻道中建立新訊息
      parameters:
      - description: 頻道 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 建立訊息請求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.CreateMessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Message'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 建立訊息
      tags:
      - messages
  /api/v1/channels/{id}/position:
    put:
      consumes:
      - application/json
      description: 更新頻道在列表中的位置（僅擁有者或管理員）
      parameters:
      - description: 頻道 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 位置請求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.PositionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 更新頻道位置
      tags:
      - Channel
  /api/v1/channels/{id}/voice/token:
    get:
      description: 回傳可用於連接 LiveKit 語音房間的 JWT token 及伺服器 URL
      parameters:
      - description: 頻道 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/voice.RoomTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 取得語音頻道 Token
      tags:
      - Voice
  /api/v1/files/{id}:
    delete:
      parameters:
      - description: File ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 刪除檔案
      tags:
      - files
    get:
      parameters:
      - description: File ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.File'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 取得檔案資訊
      tags:
      - files
  /api/v1/files/{id}/confirm:
    post:
      description: 客戶端上傳完成後呼叫，驗證物件存在並將狀態改為 active
      parameters:
      - description: File ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.File'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 確認上傳完成
      tags:
      - files
  /api/v1/files/{id}/url:
    get:
      parameters:
      - description: File ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 取得下載 URL
      tags:
      - files
  /api/v1/files/presign:
    post:
      consumes:
      - application/json
      description: 驗證檔案類型與 quota，回傳 Minio Pre-signed PUT URL
      parameters:
      - description: 上傳申請
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.PresignUploadRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.PresignUploadResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 申請上傳 URL
      tags:
      - files
  /api/v1/guilds:
    get:
      consumes:
      - application/json
      description: 列出當前使用者所屬的所有社群
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Guild'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: 列出使用者的社群
      tags:
      - Guild
    post:
      consumes:
      - application/json
      description: 建立一個新的社群，建立者自動成為擁有者
      parameters:
      - description: 建立社群請求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.CreateGuildRequest'
      produces:
      - application/json
      responses:
