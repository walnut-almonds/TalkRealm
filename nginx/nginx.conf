events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    upstream talkrealm_app {
        zone talkrealm_app 64k;
        server app:8080 resolve;
    }

    upstream minio {
        zone minio 64k;
        server minio:9000 resolve;
    }

    upstream livekit {
        zone livekit 64k;
        server livekit:7880 resolve;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name qrumi.org chat.qrumi.org media.qrumi.org voice.qrumi.org;
        return 301 https://$host$request_uri;
    }

    # HTTPS – main app
    server {
        listen 443 ssl;
        server_name qrumi.org chat.qrumi.org;

        ssl_certificate     /etc/ssl/certs/qrumi.org.pem;
        ssl_certificate_key /etc/ssl/private/qrumi.org.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Static assets – long cache (Vite outputs content-hashed filenames)
        location /assets/ {
            proxy_pass         http://talkrealm_app;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_valid  200 30d;
            add_header         Cache-Control "public, max-age=2592000, immutable";
            expires            30d;
        }

        # Proxy to Go app
        location / {
            proxy_pass         http://talkrealm_app;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }

    # HTTPS – LiveKit voice server (voice.qrumi.org)
    server {
        listen 443 ssl;
        server_name voice.qrumi.org;

        ssl_certificate     /etc/ssl/certs/qrumi.org.pem;
        ssl_certificate_key /etc/ssl/private/qrumi.org.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # LiveKit WebSocket signaling & media (wss://voice.qrumi.org/rtc/...)
        location /rtc {
            # CORS – allow only *.qrumi.org origins
            set $cors_origin "";
            if ($http_origin ~* ^https://([a-z0-9-]+\.)?qrumi\.org$) {
                set $cors_origin $http_origin;
            }

            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Livekit-SDK, X-Livekit-Protocol' always;
            add_header 'Vary' 'Origin' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Content-Length' '0' always;
                return 204;
            }

            proxy_pass         http://livekit;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # Only /rtc is served here; all other paths return 404
        location / {
            return 404;
        }
    }

    # HTTPS – MinIO presigned upload/download (media.qrumi.org)
    server {
        listen 443 ssl;
        server_name media.qrumi.org;

        ssl_certificate     /etc/ssl/certs/qrumi.org.pem;
        ssl_certificate_key /etc/ssl/private/qrumi.org.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Allow large file uploads
        client_max_body_size 100m;

        # Handle CORS preflight for cross-origin presigned PUT/GET from the frontend
        location / {
            # CORS – allow only *.qrumi.org origins
            set $cors_origin "";
            if ($http_origin ~* ^https://([a-z0-9-]+\.)?qrumi\.org$) {
                set $cors_origin $http_origin;
            }

            # Hide upstream CORS headers to avoid duplicated values
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Max-Age;

            # Always set CORS headers (needed on both preflight and actual requests)
            add_header 'Access-Control-Allow-Origin'  $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, PUT, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Amz-Date, X-Amz-Content-Sha256' always;
            add_header 'Access-Control-Max-Age'       '86400' always;
            add_header 'Vary' 'Origin' always;

            # Respond to CORS preflight immediately without forwarding to MinIO
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin'  $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, PUT, HEAD, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Amz-Date, X-Amz-Content-Sha256' always;
                add_header 'Access-Control-Max-Age'       '86400' always;
                add_header 'Vary' 'Origin' always;
                add_header 'Content-Length' '0' always;
                return 204;
            }

            proxy_pass         http://minio;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Required for PUT presigned uploads
            proxy_http_version  1.1;
            proxy_request_buffering off;
        }
    }
}
