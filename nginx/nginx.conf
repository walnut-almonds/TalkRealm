events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    upstream talkrealm_app {
        server app:8080 resolve;
    }

    upstream minio {
        server minio:9000 resolve;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name qrumi.org chat.qrumi.org media.qrumi.org;
        return 301 https://$host$request_uri;
    }

    # HTTPS – main app
    server {
        listen 443 ssl;
        server_name qrumi.org chat.qrumi.org;

        ssl_certificate     /etc/ssl/certs/qrumi.org.pem;
        ssl_certificate_key /etc/ssl/private/qrumi.org.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Proxy to Go app
        location / {
            proxy_pass         http://talkrealm_app;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 86400;
        }
    }

    # HTTPS – MinIO presigned upload/download (media.qrumi.org)
    server {
        listen 443 ssl;
        server_name media.qrumi.org;

        ssl_certificate     /etc/ssl/certs/qrumi.org.pem;
        ssl_certificate_key /etc/ssl/private/qrumi.org.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Allow large file uploads
        client_max_body_size 100m;

        location / {
            proxy_pass         http://minio;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Required for PUT presigned uploads
            proxy_http_version  1.1;
            proxy_request_buffering off;
        }
    }
}
