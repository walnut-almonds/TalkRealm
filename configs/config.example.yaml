server:
  port: 8080
  mode: debug  # debug, release
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s

database:
  host: localhost
  port: 5432
  user: talk-realm
  password: local_talk-realm_password
  dbname: talk-realm
  sslmode: disable
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 60  # 分鐘
  log_mode: false  # true 為開啟 SQL 查詢日誌

redis:
  host: localhost
  port: 6379
  password: local_talk-realm_redis_password
  db: 0

jwt:
  secret: your-secret-key-change-this-in-production
  expiration_hours: 168

log:
  level: debug  # debug, info, warn, error

oauth:
  google:
    client_id: "your-google-client-id.apps.googleusercontent.com"
    client_secret: "your-google-client-secret"
    redirect_url: "http://localhost:8080/api/v1/auth/google/callback"

minio:
  endpoint: "localhost:9000"
  public_endpoint: ""              # 留空則與 endpoint 相同；生產環境設為公開 HTTPS URL，例如 https://media.example.com
  access_key: "minioadmin"
  secret_key: "minioadmin"
  bucket: "talkrealm"
  use_ssl: false
  public_read: true           # true = bucket 開放公開讀取，URL 無 signature，需搭配 nginx/CDN 保護
  presign_expiry: 15        # Pre-signed URL 有效分鐘數（public_read=true 時無效）
  max_file_size_mb: 50      # 單檔最大 MB
  daily_upload_max: 20      # 每日上傳次數上限
  daily_bytes_max_mb: 500   # 每日上傳總量 MB 上限
  file_ttl_days: 0          # 檔案 TTL（天），0 = 永久
  lru_evict_enabled: true   # 開啟 LRU 清理

livekit:
  api_key: "devkey"         # LiveKit API Key（--dev 模式預設 devkey）
  api_secret: "secret"      # LiveKit API Secret（--dev 模式預設 secret）
  url: "ws://livekit:7880"  # 後端連線用（Docker 內部）
  public_url: "ws://localhost:7880"  # 前端連線用（宿主機）
  token_ttl: 3600           # Token 有效秒數

