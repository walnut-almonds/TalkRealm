server:
  port: 8080
  mode: release
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s

database:
  host: postgres
  port: 5432
  user: talkrealm
  password: ${DB_PASSWORD}
  dbname: talkrealm
  sslmode: disable
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 60
  log_mode: false

redis:
  host: redis
  port: 6379
  password: ${REDIS_PASSWORD}
  db: 0

jwt:
  secret: ${JWT_SECRET}
  expiration_hours: 168

log:
  level: info

oauth:
  google:
    client_id: ${GOOGLE_CLIENT_ID}
    client_secret: ${GOOGLE_CLIENT_SECRET}
    redirect_url: ${GOOGLE_REDIRECT_URL}

minio:
  endpoint: "minio:9000"
  access_key: ${MINIO_ACCESS_KEY}
  secret_key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}
  use_ssl: false
  presign_expiry: 15
  max_file_size_mb: 50
  daily_upload_max: 20
  daily_bytes_max_mb: 500
  file_ttl_days: 0
  lru_evict_enabled: true
