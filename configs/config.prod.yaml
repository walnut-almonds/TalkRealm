server:
  port: 8080
  mode: release
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s

database:
  host: postgres
  port: 5432
  user: ${DB_USER}
  password: ${DB_PASSWORD}
  dbname: ${DB_NAME}
  sslmode: disable
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 60
  log_mode: false

redis:
  host: redis
  port: 6379
  password: ${REDIS_PASSWORD}
  db: 0

jwt:
  secret: ${JWT_SECRET}
  expiration_hours: 168

log:
  level: info

oauth:
  google:
    client_id: ${GOOGLE_CLIENT_ID}
    client_secret: ${GOOGLE_CLIENT_SECRET}
    redirect_url: ${GOOGLE_REDIRECT_URL}

minio:
  endpoint: "minio:9000"
  public_endpoint: ${MINIO_PUBLIC_ENDPOINT}  # e.g. https://media.qrumi.org
  access_key: ${MINIO_ACCESS_KEY}
  secret_key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}
  public_read: true           # true = bucket 開放公開讀取，URL 無 signature，需搭配 nginx/CDN 保護
  presign_expiry: 15        # Pre-signed URL 有效分鐘數（public_read=true 時無效）
  use_ssl: false
  max_file_size_mb: 50
  daily_upload_max: 20
  daily_bytes_max_mb: 500
  file_ttl_days: 0
  lru_evict_enabled: true

livekit:
  api_key: ${LIVEKIT_API_KEY}
  api_secret: ${LIVEKIT_API_SECRET}
  url: "ws://livekit:7880"         # 後端連線用（Docker 內部）
  public_url: ${LIVEKIT_PUBLIC_URL} # e.g. wss://voice.qrumi.org
  token_ttl: 3600

deepl:
  api_key: ${DEEPL_API_KEY}
  api_url: "https://api-free.deepl.com/v2" # Free tier endpoint
  enabled: true
  auto_translate: false     # true = 發訊息時自動翻譯；false（預設）= 使用者點擊翻譯按鈕才觸發

llm:
  provider: ${LLM_PROVIDER}           # gemini or groq
  api_key: ${LLM_API_KEY}
  model: ${LLM_MODEL}                  # e.g. gemini: gemini-flash-latest；gemini-1.5-flash；groq: llama3-8b-8192
  similarity_threshold: 0.70
  enabled: true
