# Docker 開發環境配置
server:
  port: 8080
  mode: debug
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 60s

database:
  host: localhost
  port: 5432
  user: talkrealm
  password: talkrealm_password
  dbname: talkrealm
  sslmode: disable
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 60
  log_mode: true  # 開發模式顯示 SQL

redis:
  host: localhost
  port: 6379
  password: talkrealm_redis_password
  db: 0

jwt:
  secret: dev-secret-key-change-in-production-please-use-strong-random-key
  expiration_hours: 24

log:
  level: debug

oauth:
  google:
    client_id: "your-google-client-id.apps.googleusercontent.com"
    client_secret: "your-google-client-secret"
    redirect_url: "http://localhost:8080/api/v1/auth/google/callback"

minio:
  endpoint: "minio:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  bucket: "talkrealm"
  use_ssl: false
  public_read: true           # true = bucket 開放公開讀取，URL 無 signature，需搭配 nginx/CDN 保護
  presign_expiry: 15        # Pre-signed URL 有效分鐘數（public_read=true 時無效）
  max_file_size_mb: 50
  daily_upload_max: 20
  daily_bytes_max_mb: 500
  file_ttl_days: 0
  lru_evict_enabled: true

livekit:
  api_key: "devkey"         # --dev 模式預設 key
  api_secret: "secret"      # --dev 模式預設 secret
  url: "ws://livekit:7880"  # 後端連線用（Docker 內部）
  public_url: "ws://localhost:7880"  # 前端連線用（宣主機）
  token_ttl: 3600           # Token 有效秒數
