version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: talkrealm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: talkrealm
      POSTGRES_PASSWORD: talkrealm_password
      POSTGRES_DB: talkrealm
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - talkrealm-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U talkrealm -d talkrealm" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: talkrealm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass talkrealm_redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - talkrealm-network
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: talkrealm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web Console
    volumes:
      - minio_data:/data
    networks:
      - talkrealm-network
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    container_name: talkrealm-livekit
    restart: unless-stopped
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880" # WebSocket / HTTP
      - "7881:7881" # RTC TCP
      - "50100-50200:50100-50200/udp" # RTC UDP
    networks:
      - talkrealm-network
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:7880" ]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  talkrealm-network:
    driver: bridge
