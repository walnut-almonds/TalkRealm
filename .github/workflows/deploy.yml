name: Deploy to VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build \
            -ldflags "-X github.com/walnut-almonds/talkrealm/buildinfo.Version=$(git rev-parse --short HEAD)" \
            -o ./bin/server ./cmd/server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to ghcr.io
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            APP=bin/server
          tags: |
            ghcr.io/walnut-almonds/talkrealm:latest
            ghcr.io/walnut-almonds/talkrealm:${{ github.sha }}

      - name: Generate config.yaml and .env
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          test -n "$DB_PASSWORD"
          test -n "$REDIS_PASSWORD"
          test -n "$JWT_SECRET"
          envsubst < configs/config.prod.yaml > config.yaml
          printf 'POSTGRES_PASSWORD=%s\nREDIS_PASSWORD=%s\n' "$DB_PASSWORD" "$REDIS_PASSWORD" > .env

      - name: Upload compose, config and .env to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml,config.yaml,.env"
          target: "/opt/talkrealm/"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/talkrealm
            echo "Pulling latest image..."
            docker pull ghcr.io/walnut-almonds/talkrealm:latest
            echo "Restarting app container..."
            docker compose --env-file .env -f docker-compose.prod.yml up -d
            echo "Cleaning up old images..."
            docker image prune -f
            echo "Deploy complete!"
